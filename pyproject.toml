[project]
name = "levdist"
dynamic = ["version"]
description = "Package to calculate the Levenstein distance"
authors = [{ name = "Dmitry Erlikh", email = "derlih@gmail.com" }]
dependencies = []
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
keywords = ["levenstein", "edit distance"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/derlih/levdist"
Issues = "https://github.com/derlih/levdist/issues"

[build-system]
requires = ["pdm-backend", "setuptools<72.2.0"]
build-backend = "pdm.backend"

[tool.mypy]
strict = true
exclude = ["tests"]

[tool.coverage.run]
branch = true
omit = ["tests", "__init__.py"]



[tool.pdm]
distribution = true

[tool.pdm.build]
run-setuptools = true

[tool.pdm.version]
source = "scm"

[tool.pdm.scripts]
test = "pytest"
lint = "prek run --all-files"
mypy = "mypy src"
benchmark = "python benchmark.py"
test-cov.composite = ["pytest --cov src", "python -m coverage xml"]

[dependency-groups]
benchmark = [
    "pylev>=1.4.0",
    "Levenshtein>=0.27.5",
    "python-Levenshtein>=0.27.5",
    "editdistance>=0.8.1",
    "typer>=0.27.3",
    "humanize>=4.16.0",
    "rich>=15.0.0",
]
test = [
    "pytest>=9.2.0",
    "coverage>=7.17.0",
    "pytest-cov>=7.1.0",
    "psutil>=7.2.2",
]
lint = [
    "prek>=0.5.7",
    "mypy>=2.4.1",
]

[tool.cibuildwheel]
test-groups = ["test"]
test-command = "pytest {project}/tests"

[tool.ruff]
line-length = 88
indent-width = 4
# Must be in sync with `requires-python` in this file
target-version = "py311"

extend-exclude = ["pdm_build.py"]

[tool.ruff.lint]
select = ["ALL"]
fixable = ["ALL"]
