name: Upload Python Package to PyPI when a Release is Created
on:
  push:
    tags:
      - "v*.*.*"
permissions: {}
jobs:
  cibuildwheel-cpython:
    name: Build wheel package for CPython
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
        python-version: [cp311, cp312, cp313, cp314, cp315]
      fail-fast: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: all
      - name: Build wheels
        uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
        env:
          CIBW_BUILD: ${{ matrix.python-version }}-*
          CIBW_ARCHS_LINUX: auto aarch64 ppc64le s390x
      - name: Upload wheel artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-${{ matrix.os }}-${{ matrix.python-version }}
          path: wheelhouse/*
          retention-days: 1
  cibuildwheel-pypy:
    permissions:
      contents: read
    name: Build wheels for PyPy
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
        python-version: [pp311]
      fail-fast: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: all
      - name: Build wheels
        uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
        env:
          CIBW_BUILD: ${{ matrix.python-version }}-*
          CIBW_ENABLE: pypy
          CIBW_ARCHS_LINUX: auto aarch64
      - name: Upload wheel artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-${{ matrix.os }}-${{ matrix.python-version }}
          path: wheelhouse/*
          retention-days: 1
  publish:
    name: Make release
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    needs: [cibuildwheel-cpython, cibuildwheel-pypy]
    environment:
      name: pypi
      url: https://pypi.org/project/levdist
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PDM
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4.6
        with:
          python-version: "3.11"
          cache: true
      - name: Install twine
        run: pip install twine
      - name: Build sdist
        run: pdm build --no-wheel
      - name: Download artifacts
        id: download-artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
